[project]
name = "agent-admission-gate"
version = "0.1.0"
description = "Evidence-based admission for agent skills and MCP packages"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "uvicorn[standard]==0.52.1", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.1,<4", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "PyJWT[crypto]>=2.10,<3", "python-multipart>=0.0.20", "typer==0.27.1", "fastmcp>=3.4.2,<4", "boto3>=1.40,<2", "markdown-it-py>=3,<5", "bleach>=6,<7"]
[project.scripts]
aag = "aag.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/aag"]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.12", "pytest-cov>=6"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
