name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: '3.12', enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check backend
      - run: uv run ruff format --check backend
      - run: uv run pytest -q
      - name: Migration round trip
        run: |
          mkdir -p data
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: astral-sh/setup-uv@v6
        with: {python-version: '3.12'}
      - run: uv sync --frozen
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check && npm run build && npm test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: browser-failure, path: frontend/test-results, retention-days: 7}
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: docs/package-lock.json}
      - run: npm ci && npm run build
        working-directory: docs
  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [runtime, scanners]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: aag:${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Non-root container startup and HTTP smoke
        run: |
          docker run --rm aag:${{ matrix.target }} aag --help
          cid=$(docker run -d -e AAG_BOOTSTRAP_PASSWORD=ci-only-password-long aag:${{ matrix.target }})
          trap 'docker logs "$cid"; docker rm -f "$cid"' EXIT
          for attempt in $(seq 1 60); do
            if docker exec "$cid" python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"; then break; fi
            sleep 1
          done
          docker exec "$cid" python -c "import os,urllib.request; assert os.getuid() == 10001; assert b'Agent Admission Gate' in urllib.request.urlopen('http://127.0.0.1:8000/').read()"
