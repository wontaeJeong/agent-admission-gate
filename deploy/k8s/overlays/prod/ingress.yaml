apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-admission-gate
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 21m
    nginx.ingress.kubernetes.io/proxy-read-timeout: '90'
spec:
  ingressClassName: nginx
  tls:
    - hosts: [admission.example.com]
      secretName: admission-tls
  rules:
    - host: admission.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: agent-admission-gate, port: {name: http}}
