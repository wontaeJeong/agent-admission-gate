apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-admission-gate-prod
resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
patches:
  - target: {kind: ConfigMap, name: aag-config}
    patch: |-
      - op: replace
        path: /data/AAG_ENVIRONMENT
        value: prod
      - op: replace
        path: /data/AAG_PUBLIC_URL
        value: https://admission.example.com
